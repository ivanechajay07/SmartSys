name: CI

on:
  push:
    branches: [main, ivan.echajay]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Pruebas
        working-directory: backend
        run: mvn -B test

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Pruebas unitarias
        working-directory: frontend
        run: npm test
      - name: Cobertura
        working-directory: frontend
        run: npm run test:coverage
      - name: Build de producción
        working-directory: frontend
        run: npm run build
      - name: Auditoría de dependencias
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E + accesibilidad
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password-2026
      MYSQL_PASSWORD: ci-app-password-2026
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long-2026
      SEED_DEMO: 'true'
      SEED_PASSWORD: 'Admin123!'
      FRONTEND_PORT: '8082'
      PHPMYADMIN_PORT: '18085'
      MYSQL_PORT: '13306'
      CORS_ALLOWED_ORIGINS: http://localhost:8082
      REFRESH_COOKIE_SECURE: 'false'
      RATE_LIMIT_LOGIN_PER_MINUTE: '60'
      RATE_LIMIT_FORGOT_PER_MINUTE: '10'
      RATE_LIMIT_EXPORT_PER_MINUTE: '30'
    steps:
      - uses: actions/checkout@v4
      - name: Levantar la pila
        run: docker compose up -d --build
      - name: Esperar frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8082/ >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias y navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E + axe
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8082
        run: npm run e2e
      - name: Logs si falla
        if: failure()
        run: docker compose logs
      - name: Limpiar
        if: always()
        run: docker compose down -v

  images:
    name: Imágenes y análisis de vulnerabilidades
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: |
          docker build -t smartsys-backend:ci backend
          docker build -t smartsys-frontend:ci frontend
      - name: Trivy backend (informativo)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: smartsys-backend:ci
          severity: CRITICAL,HIGH
          format: table
          exit-code: '0'
      - name: Trivy frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: smartsys-frontend:ci
          severity: CRITICAL,HIGH
          format: table
          exit-code: '1'
