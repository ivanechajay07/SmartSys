spring:
  datasource:
    url: jdbc:h2:mem:smartsys;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: SmartSysTestSecretKeyAtLeast32BytesLongForHmac
    expiration-minutes: 30
    refresh-days: 7
  cors:
    allowed-origins: http://localhost:5173
  seed:
    password: Admin123!
    demo: false
  alerts:
    cron: "0 0 3 * * *"

logging:
  level:
    root: WARN
    com.higienesalud.smartsys: INFO
