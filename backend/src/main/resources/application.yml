server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smartsys
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartsys}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER:smartsys}
    password: ${DB_PASSWORD:smartsys}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:SmartSysChangeThisSecretKeyForProduction2026AtLeast32Bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081}
  seed:
    password: ${SEED_PASSWORD:Admin123!}
    demo: ${SEED_DEMO:false}
  alerts:
    cron: ${ALERTS_CRON:0 0 */6 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    version: ${SPRINGDOC_SWAGGER_UI_VERSION:5.34.1}

logging:
  level:
    root: INFO
    com.higienesalud.smartsys: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
