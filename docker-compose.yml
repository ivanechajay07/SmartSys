services:
  mysql:
    image: mysql:8.4
    container_name: smartsys-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartsys}
      MYSQL_USER: ${MYSQL_USER:-smartsys}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartsys}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en el archivo .env}
      TZ: ${TZ:-America/Lima}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - smartsys_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - smartsys

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: smartsys-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - smartsys

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartsys-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-smartsys}
      DB_USER: ${MYSQL_USER:-smartsys}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartsys}
      FLYWAY_ENABLED: "true"
      DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en el archivo .env con al menos 32 caracteres}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8082}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-Admin123!}
      ALERTS_CRON: ${ALERTS_CRON:-0 0 */6 * * *}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
      TZ: ${TZ:-America/Lima}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - smartsys

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartsys-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smartsys

volumes:
  smartsys_mysql_data:
    name: smartsys_mysql_data

networks:
  smartsys:
    name: smartsys_network
